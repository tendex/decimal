name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24", stable]
        goarch: [amd64, "386"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false # the module has no dependencies to cache
      - name: Vet
        run: go vet ./...
        env:
          GOARCH: ${{ matrix.goarch }}
      - name: Test
        # The reference implementation is slow on 32-bit words; the short
        # run still covers every path.
        run: go test ${{ matrix.goarch == '386' && '-short' || '' }} ./...
        env:
          GOARCH: ${{ matrix.goarch }}

  cross-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Compare results and flags with Python decimal
        # Each operand set produces 28 operations across decimal64 and decimal128.
        shell: bash
        run: go run ./internal/xcheck 10000 | python3 internal/xcheck/verify.py

  benchmarks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmarks
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: benchmarks/go.mod
          cache-dependency-path: benchmarks/go.sum
      - name: Vet
        run: go vet ./...
      - name: Libraries agree, and every benchmark runs
        run: go test -bench . -benchtime 1x ./...

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Generated files are up to date
        run: |
          go generate ./...
          git diff --exit-code
