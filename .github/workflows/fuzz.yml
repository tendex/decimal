name: Fuzz

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzParse, FuzzFloat64, FuzzArithmetic64, FuzzArithmetic128]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Fuzz for ten minutes
        run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime=10m -parallel=2 .
      - name: Retain failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}
          path: testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 14
